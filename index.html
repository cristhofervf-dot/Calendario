<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calendario de Horarios - 2 Usuarios</title>
  <style>
    :root {
      --user1: #3b82f6;
      --user2: #10b981;
      --free: #f59e0b;
      --bg: #0f172a;
      --card: #1e293b;
      --text: #f1f5f9;
      --muted: #94a3b8;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 1.6rem;
    }

    .subtitle {
      text-align: center;
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 0.95rem;
    }

    /* Controles superiores */
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      align-items: center;
      justify-content: space-between;
      background: var(--card);
      padding: 16px 20px;
      border-radius: 12px;
      margin-bottom: 20px;
      border: 1px solid var(--border);
    }

    .month-nav {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .month-nav button {
      background: var(--border);
      border: none;
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.2s;
    }

    .month-nav button:hover { background: #475569; }

    #monthLabel {
      font-size: 1.25rem;
      font-weight: 600;
      min-width: 180px;
      text-align: center;
    }

    .users-config {
      display: flex;
      gap: 16px;
      flex-wrap: wrap;
      align-items: center;
    }

    .user-input {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .user-input label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .user-input input {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      width: 120px;
      font-size: 0.9rem;
    }

    .user-input input:focus {
      outline: none;
      border-color: var(--user1);
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      flex-shrink: 0;
    }

    .dot-u1 { background: var(--user1); }
    .dot-u2 { background: var(--user2); }
    .dot-free { background: var(--free); }

    /* Botones de backup */
    .backup-btns {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    /* Leyenda */
    .legend {
      display: flex;
      gap: 20px;
      margin-bottom: 16px;
      font-size: 0.85rem;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .legend span {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Calendario */
    .calendar {
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      overflow: hidden;
    }

    .weekdays {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #0f172a;
      border-bottom: 1px solid var(--border);
    }

    .weekdays div {
      text-align: center;
      padding: 12px 4px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--muted);
      text-transform: uppercase;
    }

    .days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day {
      min-height: 110px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: 8px;
      cursor: pointer;
      transition: background 0.15s;
      position: relative;
    }

    .day:nth-child(7n) { border-right: none; }
    .day:hover { background: #273549; }
    .day.other-month { opacity: 0.35; }
    .day.today { background: #1e3a5f; }
    .day.selected { outline: 2px solid #f59e0b; outline-offset: -2px; }
    .day.has-free { background: rgba(245, 158, 11, 0.08); }

    .day-number {
      font-weight: 600;
      font-size: 0.95rem;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .slots {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .slot {
      font-size: 0.7rem;
      padding: 2px 5px;
      border-radius: 4px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: white;
    }

    .slot-u1 { background: var(--user1); }
    .slot-u2 { background: var(--user2); }
    .slot-free {
      background: var(--free);
      color: #1e293b;
      font-weight: 600;
    }

    /* Panel de edición */
    .panel {
      margin-top: 20px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
      padding: 20px;
      display: none;
    }

    .panel.visible { display: block; }

    .panel h3 {
      margin-bottom: 16px;
      font-size: 1.1rem;
    }

    .form-row {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: flex-end;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .form-group input,
    .form-group select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 0.9rem;
    }

    .form-group input:focus,
    .form-group select:focus {
      outline: none;
      border-color: var(--user1);
    }

    .btn {
      padding: 8px 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 500;
      transition: opacity 0.2s;
    }

    .btn:hover { opacity: 0.85; }
    .btn-primary { background: var(--user1); color: white; }
    .btn-secondary { background: var(--user2); color: white; }
    .btn-free { background: var(--free); color: #1e293b; font-weight: 600; }
    .btn-danger { background: #ef4444; color: white; }
    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--muted);
    }
    .btn-sm {
      padding: 6px 12px;
      font-size: 0.8rem;
    }

    .actions {
      display: flex;
      gap: 10px;
      margin-top: 8px;
      flex-wrap: wrap;
    }

    .free-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 16px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .saved-list {
      margin-top: 16px;
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .saved-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      border-bottom: 1px solid var(--border);
      font-size: 0.9rem;
      gap: 8px;
    }

    .saved-item:last-child { border-bottom: none; }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: #10b981;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 0.9rem;
      opacity: 0;
      transform: translateY(10px);
      transition: all 0.3s;
      z-index: 100;
      max-width: 320px;
    }

    .toast.show {
      opacity: 1;
      transform: translateY(0);
    }

    .toast.error { background: #ef4444; }

    /* Modal de backup info */
    .backup-info {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 8px;
    }

    input[type="file"] { display: none; }

    @media (max-width: 700px) {
      .day { min-height: 80px; padding: 4px; }
      .slot { font-size: 0.65rem; }
      .controls { flex-direction: column; align-items: stretch; }
      .backup-btns { justify-content: flex-start; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📅 Calendario de Horarios</h1>
    <p class="subtitle">Dos usuarios · Mismo mes · Horarios independientes · Día libre · Copia de seguridad</p>

    <div class="controls">
      <div class="month-nav">
        <button id="prevMonth" title="Mes anterior">‹</button>
        <span id="monthLabel"></span>
        <button id="nextMonth" title="Mes siguiente">›</button>
      </div>

      <div class="users-config">
        <div class="user-input">
          <span class="dot dot-u1"></span>
          <label>Usuario 1:</label>
          <input type="text" id="name1" value="Ana" maxlength="20">
        </div>
        <div class="user-input">
          <span class="dot dot-u2"></span>
          <label>Usuario 2:</label>
          <input type="text" id="name2" value="Carlos" maxlength="20">
        </div>
        <div class="backup-btns">
          <button class="btn btn-ghost btn-sm" id="exportBtn" title="Descargar copia de seguridad">⬇ Exportar</button>
          <button class="btn btn-ghost btn-sm" id="importBtn" title="Restaurar desde archivo">⬆ Importar</button>
          <input type="file" id="importFile" accept=".json,application/json">
        </div>
      </div>
    </div>

    <div class="legend">
      <span><span class="dot dot-u1"></span> <span id="legend1">Ana</span></span>
      <span><span class="dot dot-u2"></span> <span id="legend2">Carlos</span></span>
      <span><span class="dot dot-free"></span> Día libre</span>
      <span>Haz clic en un día para agregar / editar</span>
    </div>

    <div class="calendar">
      <div class="weekdays">
        <div>Lun</div><div>Mar</div><div>Mié</div><div>Jue</div>
        <div>Vie</div><div>Sáb</div><div>Dom</div>
      </div>
      <div class="days" id="daysGrid"></div>
    </div>

    <!-- Panel de edición del día seleccionado -->
    <div class="panel" id="editPanel">
      <h3 id="panelTitle">Horarios del día</h3>

      <!-- Día libre -->
      <div class="free-actions">
        <button class="btn btn-free btn-sm" id="freeUser1Btn">🏖 Día libre · Usuario 1</button>
        <button class="btn btn-free btn-sm" id="freeUser2Btn">🏖 Día libre · Usuario 2</button>
        <button class="btn btn-ghost btn-sm" id="freeBothBtn">🏖 Día libre · Ambos</button>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label>Usuario</label>
          <select id="slotUser">
            <option value="1">Usuario 1</option>
            <option value="2">Usuario 2</option>
          </select>
        </div>
        <div class="form-group">
          <label>Desde</label>
          <input type="time" id="slotStart" value="09:00">
        </div>
        <div class="form-group">
          <label>Hasta</label>
          <input type="time" id="slotEnd" value="10:00">
        </div>
        <div class="form-group">
          <label>Nota (opcional)</label>
          <input type="text" id="slotNote" placeholder="Reunión, gym..." maxlength="40">
        </div>
        <button class="btn btn-primary" id="addSlotBtn">+ Agregar horario</button>
      </div>

      <div class="saved-list" id="daySlotsList"></div>

      <div class="actions">
        <button class="btn btn-ghost" id="closePanelBtn">Cerrar</button>
        <button class="btn btn-danger" id="clearDayBtn">Borrar todo el día</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ========== ESTADO ==========
    const STORAGE_KEY = 'calendario_horarios_v2';

    let currentDate = new Date();
    currentDate.setDate(1);

    let selectedDate = null;
    let data = loadData();

    // ========== NOMBRES ==========
    const name1Input = document.getElementById('name1');
    const name2Input = document.getElementById('name2');
    const legend1 = document.getElementById('legend1');
    const legend2 = document.getElementById('legend2');
    const slotUserSelect = document.getElementById('slotUser');

    function updateNames() {
      const n1 = name1Input.value.trim() || 'Usuario 1';
      const n2 = name2Input.value.trim() || 'Usuario 2';
      legend1.textContent = n1;
      legend2.textContent = n2;
      slotUserSelect.options[0].text = n1;
      slotUserSelect.options[1].text = n2;
      document.getElementById('freeUser1Btn').textContent = '🏖 Día libre · ' + n1;
      document.getElementById('freeUser2Btn').textContent = '🏖 Día libre · ' + n2;
      saveNames();
      renderCalendar();
      if (selectedDate) renderDaySlots();
    }

    name1Input.addEventListener('change', updateNames);
    name2Input.addEventListener('change', updateNames);
    name1Input.addEventListener('blur', updateNames);
    name2Input.addEventListener('blur', updateNames);

    function saveNames() {
      data.__names = {
        1: name1Input.value.trim() || 'Usuario 1',
        2: name2Input.value.trim() || 'Usuario 2'
      };
      persist();
    }

    function loadNames() {
      if (data.__names) {
        name1Input.value = data.__names[1] || 'Ana';
        name2Input.value = data.__names[2] || 'Carlos';
      }
      updateNames();
    }

    // ========== LOCAL STORAGE ==========
    function loadData() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) return JSON.parse(raw);
        // Migrar de versión anterior si existe
        const old = localStorage.getItem('calendario_horarios_v1');
        if (old) {
          const parsed = JSON.parse(old);
          localStorage.setItem(STORAGE_KEY, old);
          return parsed;
        }
        return {};
      } catch {
        return {};
      }
    }

    function persist() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    }

    // ========== UTILIDADES ==========
    function toKey(year, month, day) {
      return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }

    function formatDateES(key) {
      const [y, m, d] = key.split('-').map(Number);
      const date = new Date(y, m - 1, d);
      return date.toLocaleDateString('es-ES', {
        weekday: 'long', day: 'numeric', month: 'long', year: 'numeric'
      });
    }

    function showToast(msg, isError = false) {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.classList.toggle('error', isError);
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function getUserName(user) {
      return data.__names?.[user] || (user === 1 ? 'Usuario 1' : 'Usuario 2');
    }

    // ========== RENDER CALENDARIO ==========
    function renderCalendar() {
      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      const monthNames = [
        'Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio',
        'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'
      ];
      document.getElementById('monthLabel').textContent = `${monthNames[month]} ${year}`;

      const firstDay = new Date(year, month, 1);
      let startWeekday = firstDay.getDay();
      startWeekday = startWeekday === 0 ? 6 : startWeekday - 1;

      const daysInMonth = new Date(year, month + 1, 0).getDate();
      const daysInPrev = new Date(year, month, 0).getDate();

      const today = new Date();
      const todayKey = toKey(today.getFullYear(), today.getMonth(), today.getDate());

      const grid = document.getElementById('daysGrid');
      grid.innerHTML = '';

      for (let i = startWeekday - 1; i >= 0; i--) {
        const d = daysInPrev - i;
        grid.appendChild(createDayCell(year, month - 1, d, true));
      }

      for (let d = 1; d <= daysInMonth; d++) {
        const key = toKey(year, month, d);
        const cell = createDayCell(year, month, d, false);
        if (key === todayKey) cell.classList.add('today');
        if (key === selectedDate) cell.classList.add('selected');
        grid.appendChild(cell);
      }

      const totalCells = grid.children.length;
      const remaining = totalCells % 7 === 0 ? 0 : 7 - (totalCells % 7);
      for (let d = 1; d <= remaining; d++) {
        grid.appendChild(createDayCell(year, month + 1, d, true));
      }
    }

    function createDayCell(year, month, day, other) {
      let realYear = year;
      let realMonth = month;
      if (realMonth < 0) { realMonth = 11; realYear--; }
      if (realMonth > 11) { realMonth = 0; realYear++; }

      const key = toKey(realYear, realMonth, day);
      const cell = document.createElement('div');
      cell.className = 'day' + (other ? ' other-month' : '');
      cell.dataset.key = key;

      const slots = data[key] || [];
      const hasFree = slots.some(s => s.free);
      if (hasFree) cell.classList.add('has-free');

      const num = document.createElement('div');
      num.className = 'day-number';
      num.textContent = day;
      cell.appendChild(num);

      const slotsDiv = document.createElement('div');
      slotsDiv.className = 'slots';

      slots.forEach(s => {
        const el = document.createElement('div');
        if (s.free) {
          el.className = 'slot slot-free';
          el.textContent = '🏖 ' + getUserName(s.user);
          el.title = 'Día libre: ' + getUserName(s.user);
        } else {
          el.className = `slot slot-u${s.user}`;
          el.textContent = `${s.start}-${s.end}${s.note ? ' · ' + s.note : ''}`;
          el.title = `${getUserName(s.user)}: ${s.start} - ${s.end}${s.note ? ' (' + s.note + ')' : ''}`;
        }
        slotsDiv.appendChild(el);
      });

      cell.appendChild(slotsDiv);

      cell.addEventListener('click', () => {
        if (other) return;
        selectDay(key);
      });

      return cell;
    }

    // ========== SELECCIÓN DE DÍA ==========
    function selectDay(key) {
      selectedDate = key;
      document.getElementById('panelTitle').textContent =
        'Horarios · ' + formatDateES(key);
      document.getElementById('editPanel').classList.add('visible');
      renderDaySlots();
      renderCalendar();
      document.getElementById('editPanel').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function renderDaySlots() {
      const list = document.getElementById('daySlotsList');
      list.innerHTML = '';
      const slots = data[selectedDate] || [];

      if (slots.length === 0) {
        list.innerHTML = '<p style="color:var(--muted);font-size:0.9rem;">Sin horarios ni días libres. Agrega uno arriba.</p>';
        return;
      }

      const sorted = [...slots].sort((a, b) => {
        if (a.free && !b.free) return -1;
        if (!a.free && b.free) return 1;
        if (a.free && b.free) return a.user - b.user;
        return (a.start || '').localeCompare(b.start || '');
      });

      sorted.forEach((s) => {
        const originalIdx = slots.indexOf(s);
        const name = getUserName(s.user);
        const item = document.createElement('div');
        item.className = 'saved-item';

        if (s.free) {
          item.innerHTML = `
            <span>
              <span class="dot dot-free"></span>
              <strong>🏖 Día libre</strong> · ${name}
            </span>
            <button class="btn btn-danger btn-sm" data-idx="${originalIdx}">Eliminar</button>
          `;
        } else {
          item.innerHTML = `
            <span>
              <span class="dot ${s.user === 1 ? 'dot-u1' : 'dot-u2'}"></span>
              <strong>${name}</strong> · ${s.start} – ${s.end}
              ${s.note ? `<span style="color:var(--muted)"> · ${s.note}</span>` : ''}
            </span>
            <button class="btn btn-danger btn-sm" data-idx="${originalIdx}">Eliminar</button>
          `;
        }

        item.querySelector('button').addEventListener('click', (e) => {
          e.stopPropagation();
          removeSlot(originalIdx);
        });
        list.appendChild(item);
      });
    }

    // ========== AGREGAR HORARIO ==========
    document.getElementById('addSlotBtn').addEventListener('click', () => {
      if (!selectedDate) return;

      const user = Number(document.getElementById('slotUser').value);
      const start = document.getElementById('slotStart').value;
      const end = document.getElementById('slotEnd').value;
      const note = document.getElementById('slotNote').value.trim();

      if (!start || !end) {
        showToast('Completa las horas', true);
        return;
      }
      if (start >= end) {
        showToast('La hora de fin debe ser posterior al inicio', true);
        return;
      }

      // Si ya tiene día libre para ese usuario, avisar
      const existing = data[selectedDate] || [];
      if (existing.some(s => s.user === user && s.free)) {
        if (!confirm(getUserName(user) + ' ya tiene día libre. ¿Agregar horario de todas formas?')) return;
      }

      if (!data[selectedDate]) data[selectedDate] = [];
      data[selectedDate].push({ user, start, end, note, free: false });
      persist();
      renderDaySlots();
      renderCalendar();
      document.getElementById('slotNote').value = '';
      showToast('Horario guardado ✓');
    });

    // ========== DÍA LIBRE ==========
    function markFreeDay(user) {
      if (!selectedDate) return;

      if (!data[selectedDate]) data[selectedDate] = [];

      // Evitar duplicados de día libre para el mismo usuario
      const already = data[selectedDate].findIndex(s => s.user === user && s.free);
      if (already !== -1) {
        showToast(getUserName(user) + ' ya tiene día libre marcado');
        return;
      }

      data[selectedDate].push({ user, free: true });
      persist();
      renderDaySlots();
      renderCalendar();
      showToast('Día libre marcado · ' + getUserName(user));
    }

    document.getElementById('freeUser1Btn').addEventListener('click', () => markFreeDay(1));
    document.getElementById('freeUser2Btn').addEventListener('click', () => markFreeDay(2));
    document.getElementById('freeBothBtn').addEventListener('click', () => {
      markFreeDay(1);
      markFreeDay(2);
    });

    // ========== ELIMINAR ==========
    function removeSlot(idx) {
      if (!selectedDate || !data[selectedDate]) return;
      data[selectedDate].splice(idx, 1);
      if (data[selectedDate].length === 0) delete data[selectedDate];
      persist();
      renderDaySlots();
      renderCalendar();
      showToast('Eliminado');
    }

    document.getElementById('clearDayBtn').addEventListener('click', () => {
      if (!selectedDate) return;
      if (!confirm('¿Borrar todos los horarios y días libres de este día?')) return;
      delete data[selectedDate];
      persist();
      renderDaySlots();
      renderCalendar();
      showToast('Día limpiado');
    });

    document.getElementById('closePanelBtn').addEventListener('click', () => {
      selectedDate = null;
      document.getElementById('editPanel').classList.remove('visible');
      renderCalendar();
    });

    // ========== NAVEGACIÓN ==========
    document.getElementById('prevMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() - 1);
      selectedDate = null;
      document.getElementById('editPanel').classList.remove('visible');
      renderCalendar();
    });

    document.getElementById('nextMonth').addEventListener('click', () => {
      currentDate.setMonth(currentDate.getMonth() + 1);
      selectedDate = null;
      document.getElementById('editPanel').classList.remove('visible');
      renderCalendar();
    });

    // ========== COPIA DE SEGURIDAD ==========
    document.getElementById('exportBtn').addEventListener('click', () => {
      const exportData = {
        version: 2,
        exportedAt: new Date().toISOString(),
        data: data
      };
      const blob = new Blob([JSON.stringify(exportData, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const dateStr = new Date().toISOString().slice(0, 10);
      a.href = url;
      a.download = `calendario-backup-${dateStr}.json`;
      a.click();
      URL.revokeObjectURL(url);
      showToast('Copia de seguridad descargada ✓');
    });

    document.getElementById('importBtn').addEventListener('click', () => {
      document.getElementById('importFile').click();
    });

    document.getElementById('importFile').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (ev) => {
        try {
          const parsed = JSON.parse(ev.target.result);
          // Aceptar formato nuevo { version, data } o el objeto directo
          const incoming = parsed.data !== undefined ? parsed.data : parsed;

          if (typeof incoming !== 'object' || incoming === null) {
            throw new Error('Formato inválido');
          }

          if (!confirm('¿Restaurar la copia de seguridad? Se reemplazarán los datos actuales.')) {
            e.target.value = '';
            return;
          }

          data = incoming;
          persist();
          loadNames();
          selectedDate = null;
          document.getElementById('editPanel').classList.remove('visible');
          renderCalendar();
          showToast('Copia de seguridad restaurada ✓');
        } catch (err) {
          showToast('Error al importar: archivo no válido', true);
        }
        e.target.value = '';
      };
      reader.readAsText(file);
    });

    // ========== INICIO ==========
    loadNames();
    renderCalendar();
  </script>
</body>
</html>
